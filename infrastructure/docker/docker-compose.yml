services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: receptionai_postgres
    restart: always
    environment:
      POSTGRES_USER: receptionai
      POSTGRES_PASSWORD: receptionai_password
      POSTGRES_DB: receptionai_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receptionai -d receptionai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: receptionai_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
