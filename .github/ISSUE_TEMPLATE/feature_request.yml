name: Feature request
description: Propose a product or maintainer-workflow improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest change that would help.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Receptionist builder
        - Knowledge / RAG
        - Scheduling / calendar
        - Communications
        - Security / tenancy
        - Maintainer automation / CI
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. What else did you try or reject?
  - type: checkboxes
    id: security
    attributes:
      label: Security impact
      options:
        - label: This change could affect tenant isolation, tools, webhooks, or outbound messaging
        - label: I have read SECURITY.md and AGENTS.md
          required: true
